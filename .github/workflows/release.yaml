name: Release

# By hand only. Next plain tag from the bump, the multi-arch image (ship.yaml images) pushed to ghcr.io with its
# version, sha and moving tags, then the GitHub release.
# gh workflow run Release -f bump=patch
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [patch, minor, major, auto]
        default: patch

jobs:
  release:
    uses: trick77/ship/.github/workflows/release.yaml@master
    with:
      bump: ${{ inputs.bump }}
      go-dir: backend
    permissions:
      contents: write
      packages: write
