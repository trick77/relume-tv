name: CI

# By hand only: the pre-push hook runs the same gate, ship check, before every push.
# gh workflow run CI --ref <branch>
# A fork PR has no hook, and dispatch only sees this repo's branches: push its head here first.
# git push origin pull/<n>/head:refs/heads/pr-<n> && gh workflow run CI --ref pr-<n>
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: trick77/ship/.github/workflows/check.yaml@master
